name: Nightly mutation breadth audit

# Broad replay changes source in place and runs all package targets. A separate
# scheduled checkout keeps that expensive audit out of the train's critical path.
on:
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: mutations-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
        shard: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation-audit-${{ matrix.runner }}
      - name: Install cargo-nextest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl.exe --fail --location --silent --show-error --ssl-revoke-best-effort --retry 3 --output nextest.tar.gz https://get.nexte.st/latest/windows-tar
            tar zxf nextest.tar.gz -C "$HOME/.cargo/bin"
            rm nextest.tar.gz
          else
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          fi
          cargo nextest --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mutation checker dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Install pinned mutation runner
        shell: bash
        run: |
          # A restored Rust cache can carry cargo's install record for this rev
          # while ~/.cargo/bin still holds an older ckdev-mutate, so cargo skips
          # the install. Check the version and force a reinstall when it differs.
          want='ckdev-mutate 0.10.0'
          cargo install --locked --git https://github.com/cortexkit/commons --rev a2db1cfd9149424257bbed675c55434d0915138e cortexkit-mutate
          if [ "$(ckdev-mutate --version)" != "$want" ]; then
            cargo install --locked --force --git https://github.com/cortexkit/commons --rev a2db1cfd9149424257bbed675c55434d0915138e cortexkit-mutate
          fi
          test "$(ckdev-mutate --version)" = "$want"
      # synapse-module tests launch these binaries to assert feature-off refusal;
      # compiling those tests alone does not build the worker executables.
      - name: Build feature-off GPU worker refusal fixtures
        shell: bash
        run: cargo build --locked --no-default-features -p synapse-worker-cuda -p synapse-worker-vulkan
      - name: Audit all package test targets
        shell: bash
        run: |
          python -m unittest scripts.test_mutation_ci.MutationAuditTests -v
          mkdir -p target/mutations
          python scripts/prepare-mutation-audit.py mutations.d target/mutations/broad.toml
          ckdev-mutate --catalogue target/mutations/broad.toml check
          ckdev-mutate --catalogue target/mutations/broad.toml run --all --broad --shard '${{ matrix.shard }}' --report target/mutations/nightly.json
      - name: Retain breadth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutations-nightly-${{ matrix.runner }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: target/mutations/nightly.json
          if-no-files-found: error
