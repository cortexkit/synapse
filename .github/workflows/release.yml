name: release

# Alpha distribution contract (ck setup): every released binary ships as
# <binary>-<os>-<arch>.zip with the binary at the archive root, beside a
# <binary>-<os>-<arch>.zip.sha256 holding the hex sha256 of the zip bytes in
# shasum format. Installers resolve the latest GitHub release, so this
# workflow only runs on version tags and uploads to the tag's release.
#
# Platform sets. Deliberately absent: owned-CUDA (needs an nvcc build
# environment the hosted runners do not carry; it remains a manual CI gate
# and joins the matrix when a CUDA build runner exists) and the MLX worker
# (the frozen Lane-1 reference engine, not a serving lane — production Metal
# embedding runs in-process — and its runtime loads mlx.metallib only from
# beside the executable, which the one-binary-per-zip installer contract
# cannot deliver).
# - darwin-arm64: module + opctl + llama/ane/decode workers + the Swift ANE
#                 worker the ane launcher execs from beside itself
# - linux-x64:    module + opctl + llama worker
# - windows-x64:  module + opctl + llama worker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-15
            os_arch: darwin-arm64
            binaries: >-
              ck-synapse
              ck-synapse-opctl
              ck-synapse-worker-llama
              ck-synapse-worker-ane
              ck-synapse-worker-ane-swift
              ck-synapse-worker-decode
            packages: >-
              -p synapse-module
              -p synapse-opctl
              -p synapse-worker-llama
              -p synapse-worker-ane
              -p synapse-worker-decode
          - name: linux-x64
            runner: ubuntu-24.04
            os_arch: linux-x64
            binaries: >-
              ck-synapse
              ck-synapse-opctl
              ck-synapse-worker-llama
            packages: >-
              -p synapse-module
              -p synapse-opctl
              -p synapse-worker-llama
          - name: windows-x64
            runner: windows-2025
            os_arch: windows-x64
            binaries: >-
              ck-synapse
              ck-synapse-opctl
              ck-synapse-worker-llama
            packages: >-
              -p synapse-module
              -p synapse-opctl
              -p synapse-worker-llama
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout synapse
        uses: actions/checkout@v4
        with:
          path: synapse

      # Public sibling path-dependencies. Cargo.lock pins their crate
      # versions but not their commits, so siblings.lock carries the exact
      # SHAs the lock was refreshed against; checking out anything newer makes
      # `cargo build --locked` refuse.
      - name: Resolve sibling pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          for name in subconscious commons; do
            sha=$(grep "^${name}=" synapse/siblings.lock | cut -d= -f2)
            [ -n "$sha" ] || { echo "siblings.lock: missing pin for $name" >&2; exit 1; }
            echo "${name}=${sha}" >> "$GITHUB_OUTPUT"
          done
      - name: Checkout subconscious
        uses: actions/checkout@v4
        with:
          repository: cortexkit/subconscious
          ref: ${{ steps.pins.outputs.subconscious }}
          path: subconscious
      - name: Checkout commons
        uses: actions/checkout@v4
        with:
          repository: cortexkit/commons
          ref: ${{ steps.pins.outputs.commons }}
          path: commons

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Select full Xcode (darwin)
        if: matrix.name == 'darwin-arm64'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install LLVM (windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $attempts = 0
          do {
            $attempts++
            choco install llvm -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (15 * $attempts)
          } while ($attempts -lt 3)
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build release binaries
        working-directory: synapse
        shell: bash
        env:
          DEVELOPER_DIR: ${{ matrix.name == 'darwin-arm64' && '/Applications/Xcode.app/Contents/Developer' || '' }}
        run: cargo build --release --locked ${{ matrix.packages }}

      # The ANE launcher execs a Swift worker it resolves from beside its own
      # executable. build.rs leaves that worker in cargo's OUT_DIR; it ships as
      # its own named asset so the installer records and upgrades it like any
      # other binary.
      - name: Stage the Swift ANE worker as a release binary
        if: matrix.name == 'darwin-arm64'
        working-directory: synapse
        shell: bash
        run: |
          set -euo pipefail
          swift_worker=$(find target/release/build -type f -name ck-synapse-worker-ane-swift | head -1)
          [ -n "$swift_worker" ] || { echo "Swift ANE worker artifact not found" >&2; exit 1; }
          cp "$swift_worker" target/release/ck-synapse-worker-ane-swift
          target/release/ck-synapse-worker-ane-swift --version

      - name: Package assets (zip + sha256)
        working-directory: synapse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in ${{ matrix.binaries }}; do
            src="target/release/$bin"
            [ -f "$src" ] || src="target/release/$bin.exe"
            [ -f "$src" ] || { echo "missing built binary: $bin" >&2; exit 1; }
            asset="$bin-${{ matrix.os_arch }}.zip"
            staging="$(mktemp -d)"
            cp "$src" "$staging/"
            (cd "$staging" && 7z a -tzip "$OLDPWD/dist/$asset" . >/dev/null)
            # shasum is absent from the Windows runner's git-bash; sha256sum
            # prints the identical "<hex>  <name>" sidecar format.
            if command -v shasum >/dev/null 2>&1; then
              (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
            else
              (cd dist && sha256sum "$asset" > "$asset.sha256")
            fi
            rm -rf "$staging"
          done
          ls -la dist/

      - name: Smoke --version from the packaged zip
        working-directory: synapse
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          7z x "dist/ck-synapse-${{ matrix.os_arch }}.zip" -o"$probe" >/dev/null
          "$probe"/ck-synapse* --version

      # Proves the packaged launcher finds its Swift sibling once both zips
      # are extracted into one directory, as the installer does: with no
      # arguments it must reach the Swift worker's usage error, not the
      # launcher's not-found error.
      - name: Smoke ANE launcher resolution from the packaged zips (darwin)
        if: matrix.name == 'darwin-arm64'
        working-directory: synapse
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          7z x "dist/ck-synapse-worker-ane-${{ matrix.os_arch }}.zip" -o"$probe" >/dev/null
          7z x "dist/ck-synapse-worker-ane-swift-${{ matrix.os_arch }}.zip" -o"$probe" >/dev/null
          set +e
          output=$("$probe/ck-synapse-worker-ane" 2>&1)
          set -e
          echo "$output"
          grep -q "usage: synapse-worker-ane" <<<"$output"

      - name: Upload assets to the tag's release
        working-directory: synapse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "synapse ${tag} (alpha)" --prerelease
          gh release upload "$tag" dist/* --clobber
