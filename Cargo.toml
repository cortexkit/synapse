[workspace]
resolver = "2"
exclude = ["bench/parity"]
# Ordinary root builds should compile shipped components, not experimental
# benchmark engines. Benchmarks remain available through -p and --workspace.
default-members = [
    "crates/synapse-core",
    "crates/synapse-native-probe",
    "crates/synapse-certify",
    "crates/synapse-engine-owned",
    "crates/synapse-engine-cuda",
    "crates/synapse-engine-owned/owned-decode-worker",
    "crates/synapse-module",
    "crates/synapse-opctl",
    "crates/synapse-worker-llama",
    "crates/synapse-worker-cuda",
    "crates/synapse-worker-ane",
    "crates/synapse-worker-ane-direct",
    "crates/synapse-worker-decode",
    "crates/synapse-worker-vulkan",
]
members = [
    "bench/harness",
    "bench/rig",
    "bench/lanes/ort-embed",
    "bench/lanes/wrap-embed",
    "bench/lanes/llama",
    "bench/lanes/llama-inproc",
    "bench/lanes/burn",
    "bench/spikes/unified-rt",
    "bench/lanes/candle-embed",
    "crates/synapse-core",
    "crates/synapse-build-stamp",
    "crates/synapse-native-probe",
    "crates/synapse-certify",
    "crates/synapse-certify-runner",
    "crates/synapse-engine-owned",
    "crates/synapse-engine-cuda",
    "crates/synapse-engine-owned/owned-decode-worker",
    "crates/synapse-module",
    "crates/synapse-opctl",
    "crates/synapse-worker-llama",
    "crates/synapse-worker-cuda",
    "crates/synapse-worker-ane",
    "crates/synapse-worker-ane-direct",
    "crates/synapse-worker-decode",
    "crates/synapse-worker-vulkan",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"

# Windows test builds keep release assertions and native build settings without
# paying for full optimization of the workspace's many test executables.
[profile.ci-test]
inherits = "release"
opt-level = 1
codegen-units = 256
debug-assertions = false
overflow-checks = false

# Non-workspace dependencies stay fully optimized for inference and timing tests;
# Cargo's wildcard package override excludes workspace members.
[profile.ci-test.package."*"]
opt-level = 3
codegen-units = 16

# Tests launch workers through synapse_core::dev_binary::ckdev_binary, which
# SHA-256 hashes the whole executable (often 100+ MB in a debug build) on every
# launch. Unoptimized hashing dominated those tests, so optimize only the hash
# crates in dev builds. Release builds and the code under test are unchanged.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# default-features minus esaxx_fast: esaxx-rs hardcodes a static MSVC CRT in
# its C++ build, which can never link against llama.cpp's dynamic-CRT objects
# on Windows. esaxx only accelerates the unigram TRAINER — Synapse never
# trains tokenizers, so the pure-Rust fallback path is not even exercised.
tokenizers = { version = "0.21", default-features = false, features = ["progressbar", "onig"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
# The subc crates are published on crates.io and pinned exactly. subc-daemon in
# particular must not float: a caret there can resolve a daemon built on a newer
# subc-protocol minor, leaving the lock with two copies of subc-protocol and
# subc-control while this workspace's own code talks the older one. The wire
# crates move together, as one block, so the graph keeps a single copy of each.
subc-client-rs = "=0.33.0"
subc-control = "=0.34.0"
subc-daemon = "=0.39.0"
subc-protocol = "=0.34.1"
subc-transport = "=0.15.0"
# Test-only: subc-os carries the daemon's half of the launch-nonce handoff
# (the pipe it places on descriptor 3 of a spawned module), which the tests use
# to launch the module exactly as the daemon does. Pinned to the copy the SDK
# already resolves, so the lock keeps one version of it.
subc-os = "=0.1.26"
# The commons crates are published on crates.io too.
cortexkit-lease = "0.1.2"
cortexkit-store = "0.2.4"
cortexkit-store-types = "0.2.2"
cortexkit-log = "0.3.5"
tracing = "0.1"

