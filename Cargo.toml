[workspace]
resolver = "2"
members = ["bench/harness", "bench/lanes/ort-embed", "bench/lanes/burn"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokenizers = "0.21"
