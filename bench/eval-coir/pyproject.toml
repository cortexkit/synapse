[project]
name = "eval-coir"
version = "0.1.0"
description = "CoIR retrieval-quality evaluation harness for Synapse bench lanes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets==3.6.0",
  "numpy==2.3.1",
  "pytest==8.4.1",
  "pytrec-eval-terrier==0.5.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
