[package]
name = "lane-burn"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bench lane: burn wgpu/Metal embedding via burn-onnx"
publish = false
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokenizers = { workspace = true }
synapse-bench = { path = "../../harness" }
burn = { version = "=0.21.0", default-features = false, features = ["std", "metal", "fusion", "autotune"] }
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "burnpack"] }

[build-dependencies]
burn-onnx = { version = "=0.21.0", features = ["default"] }
