[package]
name = "lane-candle-embed"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bench lane: candle MiniLM embedding on CPU or Metal"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
synapse-bench = { path = "../../harness" }
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10.2", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.10.2"
