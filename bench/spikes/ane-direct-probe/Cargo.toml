[package]
name = "ane-direct-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Keep the experimental probe in its own workspace so its build and lockfile
# remain independent of the production workers.
[workspace]

[dependencies]
# Use the production direct-ANE worker's vendored binding, including its local
# compatibility and resource-management fixes, so offline builds need no clone.
ane = { path = "../../../crates/synapse-worker-ane-direct/vendor/ane" }
anyhow = "1.0"
half = "2.7"
libm = "0.2"
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
