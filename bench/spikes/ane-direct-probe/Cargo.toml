[package]
name = "ane-direct-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Deliberately outside the synapse workspace, this probe uses the in-repository
# vendored copy so builds do not depend on a local upstream checkout.
[workspace]

[dependencies]
# The binding is vendored in this repository at its pinned upstream revision.
ane = { path = "../../../crates/synapse-worker-ane-direct/vendor/ane" }
anyhow = "1.0"
half = "2.7"
libm = "0.2"
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
