[package]
name = "spike-unified-rt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spike C: owned unified tensor runtime for all-MiniLM-L6-v2 embeddings"
publish = false

[features]
default = []
cuda = []
vulkan = ["dep:ash"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokenizers = { workspace = true }
synapse-bench = { path = "../../harness" }
safetensors = "0.6.2"
half = "2"
libm = "0.2"
faer = { version = "=0.22.6", default-features = false, features = ["std", "rayon"] }
rayon = "1.10"
ash = { version = "0.38", optional = true }

[build-dependencies]
cc = "1"
