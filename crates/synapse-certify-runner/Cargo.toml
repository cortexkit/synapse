[package]
name = "synapse-certify-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "../synapse-module/build.rs"

[[bin]]
name = "ckdev-synapse-certify"
path = "src/main.rs"

[dependencies]
synapse-certify = { path = "../synapse-certify" }
synapse-core = { path = "../synapse-core" }
synapse-parity = { path = "../../bench/parity" }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
subc-daemon.workspace = true
subc-transport.workspace = true
subc-protocol.workspace = true
# std::fs::canonicalize returns verbatim `\\?\C:\...` paths on Windows. Those break
# once a forward-slash suffix is appended to them, as subc-daemon does when it
# builds the module store path. dunce returns the plain drive-letter form when
# that is equivalent and does nothing on other platforms.
dunce = "1"

[dev-dependencies]
sha2.workspace = true

[build-dependencies]
synapse-build-stamp = { path = "../synapse-build-stamp" }
