[package]
name = "synapse-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure Synapse logic: engine seams, fingerprints, alias tables, and admission skeletons."
publish = false

[dependencies]
subc-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokenizers = { workspace = true }
cortexkit-lease = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "system", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
synapse-native-probe = { path = "../synapse-native-probe" }

[dev-dependencies]
ahash = "0.8"
syn = { version = "2", features = ["full", "visit"] }

[build-dependencies]
serde_json = { workspace = true }
