[package]
name = "synapse-engine-ort"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synapse in-process ORT embedding engine."
publish = false

[dependencies]
synapse-core = { path = "../synapse-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ndarray = "0.17.2"
half = "2"

[target.'cfg(not(windows))'.dependencies]
ort = { version = "=2.0.0-rc.11", features = ["ndarray", "half"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.11", features = ["ndarray", "half", "load-dynamic"] }

[dev-dependencies]
tokenizers = { workspace = true }