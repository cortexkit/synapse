[package]
name = "synapse-module"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Synapse subc module scaffold."
publish = false

[lib]
name = "synapse_module"
path = "src/lib.rs"

[[bin]]
# Fleet convention: supervised binaries carry the ck-* prefix so they group
# in Activity Monitor. module_id stays "synapse"; this is the exe name only.
name = "ck-synapse"
path = "src/main.rs"

[[bin]]
name = "synapse-worker-timeout-mock"
path = "src/bin/timeout_worker.rs"
test = false
required-features = ["test-support"]

[[bin]]
name = "synapse-probe-stub"
path = "src/bin/probe_stub.rs"
test = false
required-features = ["test-support"]

# The end-to-end suite spawns a daemon and the module binary per test and needs
# model files, so it runs only in the scheduled lane, which passes
# `--features e2e`. Ordinary test runs neither build nor run it.
[[test]]
name = "skeleton_e2e"
path = "tests/skeleton_e2e.rs"
required-features = ["e2e"]

[features]
default = []
test-support = ["synapse-engine-owned/test-support"]
e2e = ["test-support"]

[dependencies]
anyhow = { workspace = true }
synapse-core = { path = "../synapse-core" }
synapse-certify = { path = "../synapse-certify" }
synapse-parity = { path = "../../bench/parity" }
synapse-engine-owned = { path = "../synapse-engine-owned" }
owned-decode-worker = { path = "../synapse-engine-owned/owned-decode-worker" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-store-types = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
half = "2"
safetensors = "0.6.2"
reqwest = { workspace = true }
url = { workspace = true }
cortexkit-lease = { workspace = true }
cortexkit-log = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Let self-check deadline tests pause time during their initial subscription poll.
tokio = { workspace = true, features = ["test-util"] }
syn = { version = "2", features = ["full", "visit"] }
rusqlite = { workspace = true }
subc-daemon = { workspace = true }
subc-os = { workspace = true }
subc-transport = { workspace = true }
tokenizers = { workspace = true }
synapse-engine-owned = { path = "../synapse-engine-owned", features = ["test-support"] }
# Turns on this crate's own test-support feature in test builds, so the
# ck-synapse binary the end-to-end tests spawn honours the SYNAPSE_TEST_*
# overrides (catalog, runnable backends, download barriers). Release builds
# never see it.
synapse-module = { path = ".", features = ["test-support"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[build-dependencies]
synapse-build-stamp = { path = "../synapse-build-stamp" }
