[package]
name = "synapse-module"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Synapse subc module scaffold."
publish = false

[lib]
name = "synapse_module"
path = "src/lib.rs"

[[bin]]
# Fleet convention: supervised binaries carry the ck-* prefix so they group
# in Activity Monitor. module_id stays "synapse"; this is the exe name only.
name = "ck-synapse"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
synapse-core = { path = "../synapse-core" }
synapse-engine-ort = { path = "../synapse-engine-ort" }
synapse-engine-owned = { path = "../synapse-engine-owned" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-store-types = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
httpdate = { workspace = true }
url = { workspace = true }
cortexkit-lease = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
subc-core = { workspace = true }
subc-transport = { workspace = true }
tokenizers = { workspace = true }
