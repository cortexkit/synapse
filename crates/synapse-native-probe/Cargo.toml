[package]
name = "synapse-native-probe"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Safe read-only wrappers for native machine-profile sources."
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_SystemInformation"] }
