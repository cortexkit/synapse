[package]
name = "synapse-opctl"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Operator CLI for the Synapse management surface."
publish = false

[[bin]]
name = "ck-synapse-opctl"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
tokio = { workspace = true }

# tests/connection_discovery.rs compiles synapse-core's dev_binary.rs from
# source, which checks the owner of its executable folder through rustix.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "process"] }
