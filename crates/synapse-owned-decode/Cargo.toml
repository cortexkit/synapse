[package]
name = "synapse-owned-decode"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
test-support = []

[dependencies]
anyhow = { workspace = true }
synapse-core = { path = "../synapse-core" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
half = "2"
safetensors = "0.6.2"

[dev-dependencies]
synapse-parity = { path = "../../bench/parity" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
synapse-engine-owned = { path = "../synapse-engine-owned", features = ["test-support"] }
tokenizers = { workspace = true }
