[package]
name = "synapse-speech"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable speech frontends, prompt rendering, bounded TDT decoding and word timing"

[features]
default = []
qwen = ["dep:tokenizers"]

[dependencies]
rustfft = "6"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true, optional = true }
