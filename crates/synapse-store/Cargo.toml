[package]
name = "synapse-store"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synapse persistence and migrations."
publish = false

[features]
default = []
test-support = []

[dependencies]
cortexkit-store = { workspace = true }
cortexkit-store-types = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
synapse-core = { path = "../synapse-core" }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
synapse-store = { path = ".", features = ["test-support"] }
