[package]
name = "ane"
version = "0.1.0"
edition = "2024"
authors = ["Eugene Bokhan <eugenebokhan@icloud.com>"]
license = "MIT"
description = "Rust bindings for the Apple Neural Engine (ANE) via the private AppleNeuralEngine.framework"
repository = "https://github.com/computer-graphics-tools/ane"
keywords = ["apple", "neural-engine", "ane", "machine-learning"]
categories = ["api-bindings", "hardware-support"]
build = "build.rs"

autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
thiserror = "2.0"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObjCRuntime"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "objc2", "objc2-foundation", "objc2-core-foundation", "libc"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
safetensors = "0.7"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
half = "2"
rand = "0.10"
metal = "0.29"

