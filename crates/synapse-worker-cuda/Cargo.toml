[package]
name = "synapse-worker-cuda"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Synapse supervised owned-CUDA worker binary."
publish = false

[[bin]]
name = "ck-synapse-worker-cuda"
path = "src/main.rs"

[features]
default = []
cuda = ["dep:synapse-engine-cuda", "synapse-engine-cuda/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
synapse-core = { path = "../synapse-core" }
synapse-engine-cuda = { path = "../synapse-engine-cuda", optional = true }
