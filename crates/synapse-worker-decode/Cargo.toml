[package]
name = "synapse-worker-decode"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synapse supervised owned Metal decode worker binary."
publish = false

[[bin]]
name = "ck-synapse-worker-decode"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
clap = { workspace = true }
hex = { workspace = true }
libc = "0.2"
owned-decode-worker = { path = "../synapse-engine-owned/owned-decode-worker" }
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
synapse-core = { path = "../synapse-core" }
synapse-engine-owned = { path = "../synapse-engine-owned" }
synapse-owned-decode = { path = "../synapse-owned-decode" }
tokenizers = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
synapse-worker-host = { path = "../synapse-worker-host" }
