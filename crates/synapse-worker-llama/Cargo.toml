[package]
name = "synapse-worker-llama"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synapse supervised llama.cpp worker binary."
publish = false

[[bin]]
name = "synapse-worker-llama"
path = "src/main.rs"

[dependencies]
synapse-core = { path = "../synapse-core" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.151", default-features = false, features = ["metal", "common"] }
llama-cpp-sys-2 = { version = "0.1.151", features = ["metal", "common"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.151", default-features = false, features = ["common"] }
llama-cpp-sys-2 = { version = "0.1.151", features = ["common"] }

[dev-dependencies]
synapse-module = { path = "../synapse-module" }
synapse-engine-ort = { path = "../synapse-engine-ort" }
tokenizers = { workspace = true }
tokio = { workspace = true }
