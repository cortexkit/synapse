[package]
name = "synapse-worker-mlx"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synapse supervised MLX/Metal embedding worker binary."
publish = false

[[bin]]
# ck-* prefix: fleet Activity Monitor grouping convention.
name = "ck-synapse-worker-mlx"
path = "src/main.rs"

[dependencies]
synapse-core = { path = "../synapse-core" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { version = "=0.25.3", features = ["safetensors"] }
