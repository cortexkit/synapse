
[[control]]
id = "admission-status-reports-execution-waiters"
guards = "admission.status must report a waiting execution during concurrent batches"
file = "crates/synapse-module/src/lib.rs"
old = "let execution_waiters = execution_stats.waiters;"
new = "let execution_waiters = 0; // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-module/tests/skeleton_e2e.rs"
runner = "nextest"
package = "synapse-module"
target = "--test skeleton_e2e"
select = "expected"
expect_red = ["admission_status_reports_execution_waiters_during_concurrent_batches"]
expect_message = "admission.status never exposed the semaphore waiter"
only = false
timeout_s = 600
build_timeout_s = 1800
