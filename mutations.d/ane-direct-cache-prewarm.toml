platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-cache-load-learning"
guards = "A shape loaded wholly from aned's cache is learned as a load, never as a compile or into the machine factor"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = """                (_, 0) => {
                    self.measured_loads
                        .insert((key.model_ref.clone(), key.shape), took);
                }"""
new = """                (_, 0) => self.learn(key, seed, took), // NON-VACUITY BREAK"""
test_file = "crates/synapse-module/src/worker_host/compile_cache_prewarm_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = [
    "worker_host::ane_residency::tests::cached_loads_do_not_change_the_machine_factor",
    "worker_host::ane_residency::tests::cached_shape_is_predicted_at_load_cost_and_not_refused_early",
]
expect_message = "the load was not learned as a load"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

