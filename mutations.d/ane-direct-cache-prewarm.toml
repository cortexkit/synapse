[[control]]
id = "ane-cache-load-prediction"
guards = "A shape the worker reported in aned's compile cache is predicted at its load cost, so a request is not refused early for a compile that will not happen"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "                Some(load) => load,"
new = "                Some(_) => self.compile_estimate(key, seed), // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_cache_prewarm_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::cached_shape_is_predicted_at_load_cost_and_not_refused_early"]
expect_message = "a cached shape was refused"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-cache-miss-reprice"
guards = "An admission predicted as a cached load that runs well past it is repriced as the compile it has become"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "Some(compile) if self.missed_load_at(dispatched) <= now => {"
new = "Some(compile) if false && self.missed_load_at(dispatched) <= now => { // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_cache_prewarm_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::cached_load_that_compiles_is_repriced_as_a_compile"]
expect_message = "re-checked at the miss"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-cache-miss-wake"
