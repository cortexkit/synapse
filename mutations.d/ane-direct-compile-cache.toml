[[control]]
id = "ane-direct-constant-emission-order"
guards = "Identical layer graphs emit byte-identical MIL and weights, so aned's compiled-program cache can serve them"
file = "crates/synapse-worker-ane-direct/vendor/ane/src/graph/compile.rs"
old = """        let mut constants: Vec<_> = self.constants.iter().collect();
        constants.sort_unstable_by_key(|(id, _)| **id);"""
new = """        let constants: Vec<_> = self.constants.iter().collect(); // NON-VACUITY BREAK"""
edits = []
test_file = "crates/synapse-worker-ane-direct/vendor/ane/src/graph/compile.rs"
runner = "cargo"
package = "ane"
target = "--lib"
select = "expected"
expect_red = ["graph::compile::tests::identical_graphs_emit_identical_sources"]
expect_message = "the MIL text of an identical graph changed"
only = false
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 1800
desk_only = "The vendored ANE binding compiles only on macOS; CI has no Apple runner for it. Replay the unsorted constant emission on a Mac."

[[control]]
id = "ane-direct-cached-program-load-only"
guards = "A program aned already holds is loaded without writing sources or compiling"
file = "crates/synapse-worker-ane-direct/vendor/ane/src/client.rs"
old = "    if program.compiled_model_exists() {"
new = "    if false && program.compiled_model_exists() { // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-worker-ane-direct/vendor/ane/src/client.rs"
runner = "cargo"
package = "ane"
target = "--lib"
select = "expected"
expect_red = ["client::tests::a_cached_program_is_loaded_without_writing_or_compiling"]
expect_message = "right: CacheHit"
only = false
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 1800
desk_only = "The vendored ANE binding compiles only on macOS; CI has no Apple runner for it. Replay the skipped cache query on a Mac."

[[control]]
id = "ane-direct-temp-space-compile-only"
guards = "A full temp volume refuses only layers that must compile, never a layer aned already holds"
file = "crates/synapse-worker-ane-direct/src/backend.rs"
old = """            let dir = std::env::temp_dir();
            self.admit_with_limit_progress("""
new = """            let dir = std::env::temp_dir();
            if !cached { ensure_compile_temp_space(&dir, available(&dir))?; } // NON-VACUITY BREAK
            self.admit_with_limit_progress("""
edits = []
test_file = "crates/synapse-worker-ane-direct/src/backend.rs"
runner = "cargo"
package = "synapse-worker-ane-direct"
target = "--bin ck-synapse-worker-ane-direct"
select = "expected"
expect_red = ["backend::temp_space_tests::a_layer_aned_holds_is_not_refused_on_a_full_disk"]
expect_message = "ane_temp_space_low"
only = false
platforms = ["macos"]
timeout_s = 600
build_timeout_s = 1800
desk_only = "The direct-ANE backend compiles only on macOS; CI has no Apple runner for it. Replay the shape-level temp-space check on a Mac."
