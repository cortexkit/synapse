[[control]]
id = "ane-runtime-configured-lock-path"
guards = "Cold production-load supervisor acquisition uses the runtime's fixture-configured lock path"
file = "crates/synapse-module/src/lib.rs"
old = "AneDirectLaneLock::acquire(runtime_ane_lock_path(runtime)?)?"
new = "AneDirectLaneLock::acquire(&runtime_ane_lock_path(runtime)?.with_file_name(\"wrong-fixture.lock\"))? /* NON-VACUITY BREAK */"
edits = []
test_file = "crates/synapse-module/src/lib.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["tests::cold_ane_supervisor_uses_the_runtime_fixture_lock_path"]
expect_message = "configured fixture lock"
only = false
timeout_s = 60
build_timeout_s = 1800

[[control]]
id = "ane-cold-pause-configured-lock-path"
guards = "Cold pause expiry and resume acquire the same configured fixture lock as model loading"
file = "crates/synapse-module/src/lane_pause.rs"
old = "*shared = Some(acquire_runtime_ane_supervisor(runtime)?);"
new = """
// NON-VACUITY BREAK: choose a different lock, still safely under the fixture root.
            *shared = Some(worker_host::ane_residency::AneResidencySupervisor::with_lane_lock(
                Default::default(), worker_host::ane_residency::AneDirectLaneLock::acquire(
                    &runtime_ane_lock_path(runtime)?.with_file_name("wrong-cold-fixture.lock"))?));"""
edits = []
test_file = "crates/synapse-module/src/lane_pause_tests.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["tests::lane_pause_tests::pause_covers_cold_coreml_and_omits_unknown_legacy_fingerprint"]
expect_message = "cold resume must hold the fixture"
only = false
timeout_s = 60
build_timeout_s = 1800

[[control]]
id = "ane-unit-test-production-path-guard"
guards = "The unit-test path guard rejects the production lock path without opening any file"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = """
assert_ne!(
                resolved(path),
                resolved(&production),
                "module tests must not open the production ANE lane lock"
            );"""
new = "let _ = (resolved(path), resolved(&production)); // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-module/src/worker_host/mod.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["worker_host::ane_residency::tests::module_tests_reject_the_production_lock_path_without_opening_it"]
expect_message = "production lock guard must reject"
only = false
timeout_s = 60
build_timeout_s = 1800

[[control]]
id = "ane-unit-test-requires-runtime-fixture"
guards = "An unconfigured module unit test fails closed before resolving a production lock path"
file = "crates/synapse-module/src/lib.rs"
old = """
#[cfg(test)]
    {
        let root = runtime
            .ane_lane_test_root"""
new = """
#[cfg(any())] // NON-VACUITY BREAK: disable mandatory unit-test fixture validation.
    {
        let root = runtime
            .ane_lane_test_root"""
edits = []
test_file = "crates/synapse-module/src/lib.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["tests::unconfigured_ane_runtime_cannot_resolve_a_production_lock_in_tests"]
expect_message = "unconfigured unit test must fail"
only = false
timeout_s = 60
build_timeout_s = 1800
