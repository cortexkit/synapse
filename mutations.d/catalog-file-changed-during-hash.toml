[[control]]
id = "catalog-file-changed-during-hash"
guards = "Bytes changed during hashing cannot certify the file subsequently loaded or populate a reusable verification row"
file = "crates/synapse-module/src/lib.rs"
old = "if before != after {"
new = "if false && before != after { // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-module/src/store.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["store::tests::catalog_verification_file_changed_during_hash_is_not_recorded"]
expect_message = "a file changed mid-hash must not verify"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
