[[control]]
id = "catalog-file-identity"
guards = "A changed file identity forces cold-load hashing rather than reusing a stale verification"
file = "crates/synapse-module/src/lib.rs"
old = """
if let Some(stamp) = &before {
        if store"""
new = """
if let Some(stamp) = &before {
        if true || store /* NON-VACUITY BREAK */"""
edits = []
test_file = "crates/synapse-module/src/store.rs"
runner = "nextest"
hub = "Cached digests may attest only unchanged trusted bytes, asserted by cold-load identity tests and the wire-level corrupt-blob repair contract."
hub_targets = ["synapse-module::skeleton_e2e"]
package = "synapse-module"
target = "--lib"
expect_red = ["store::tests::catalog_verification_touch_forces_rehash"]
expect_message = "assertion `left == right` failed"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
