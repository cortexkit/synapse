[[control]]
id = "catalog-file-identity"
guards = "A changed file identity forces cold-load hashing rather than reusing a stale verification"
file = "crates/synapse-module/src/store.rs"
# Keep first-load hashing and the other identity fields intact; bind both
# timestamp parameters while ignoring their values in cached verification.
old = 'AND mtime_ns=?9 AND ctime_ns=?10)",'
new = 'AND (?9 IS NOT NULL) AND (?10 IS NOT NULL))", // NON-VACUITY BREAK'
edits = []
test_file = "crates/synapse-module/src/store.rs"
runner = "nextest"
# Both timestamp-only changes and same-size corruption with restored mtime
# must invalidate an existing cached verification.
package = "synapse-module"
target = "--lib"
expect_red = [
    "store::tests::catalog_verification_touch_forces_rehash",
    "store::tests::catalog_verification_content_change_with_restored_mtime_is_refused",
]
expect_message = "/a changed file identity reused verification|corrupted artifact must be refused/"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
