[[control]]
id = "catalog-quarantine-corrupt-blob"
guards = "Quarantine unlinks corrupt bytes as well as removing their authority and pins"
file = "crates/synapse-module/src/store.rs"
old = """
let freed = cache
                .delete_blob(&digest)
                .map_err(|error| cache_error("delete blob", &digest, error))?;"""
new = "let freed = 0; // NON-VACUITY BREAK: corrupt bytes retained"
edits = []
test_file = "crates/synapse-module/src/store.rs"
runner = "nextest"
# Both the store report and the wire-level repair contract require corrupt
# bytes to be unlinked; both targets are selected below.
package = "synapse-module"
target = "--lib --test skeleton_e2e"
expect_red = [
    "store::tests::quarantine_removes_the_blob_its_installs_members_and_pins_and_fails_holding_jobs",
    "catalog_e2e::catalog_corrupt_blob_is_quarantined_and_explicit_download_repairs_it",
]
expect_message = '/freed_bytes: 4|assertion failed: !blob\.exists\(\)/'
only = false
timeout_s = 600
build_timeout_s = 1800
