[[control]]
id = "catalog-sequence-pre-admission"
guards = "Installed catalog inputs over 8192 composed tokens refuse before admission, inline budgets, job diversion, or worker requests"
file = "crates/synapse-module/src/lib.rs"
old = "    catalog_sequence_ceiling(&composed)?;"
new = "    // NON-VACUITY BREAK: skip the pre-admission catalog ceiling."
edits = []
test_file = "crates/synapse-module/src/lib.rs"
runner = "cargo"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["tests::installed_catalog_embed_boundary_precedes_admission", "tests::installed_catalog_batch_boundary_precedes_job_diversion", "tests::installed_catalog_rerank_boundary_precedes_inline_budget"]
expect_message = "/catalog pre-admission ceiling|embed.batch should return a response/"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
