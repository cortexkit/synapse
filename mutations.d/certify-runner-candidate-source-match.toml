[[control]]
id = "certify-runner-candidate-source-match"
guards = "An external certification producer refuses a candidate built from another commit"
file = "crates/synapse-certify-runner/src/command.rs"
old = "if candidate != source {"
new = "if false && candidate != source { // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-certify-runner/src/command.rs"
runner = "cargo"
select = "expected"
package = "synapse-certify-runner"
target = "--lib"
expect_red = ["command::tests::candidate_source_mismatch_is_refused"]
expect_message = "called `Result::unwrap_err()` on an `Ok` value"
only = false
timeout_s = 600
build_timeout_s = 1800
