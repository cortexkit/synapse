[[control]]
id = "ci-catalogue-fence"
guards = "Removing catalogue validation is refused by the real workflow precondition checker"
file = ".github/workflows/tests.yml"
old = "run: ckdev-mutate check"
new = "run: 'true' # NON-VACUITY BREAK"
edits = []
test_file = "scripts/test_mutation_ci.py"
runner = "command"
command = ["python", "-m", "unittest", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["scripts.test_mutation_ci.MutationCiTests.test_catalogue_check_is_required"]
expect_message = "mutation catalogue check must be unconditional"
only = false
# The precondition checker is a bash script that CI runs only on Linux; on a
# Windows runner the test's `bash` call does not reach it.
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
