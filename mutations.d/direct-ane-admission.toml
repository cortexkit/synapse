platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-admission-closed-cohort"
guards = "New resident requests cannot join or renew the completion handoff"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "cohort.is_some_and(|id| slot.joined.contains(&id) && slot.handing_off(now));"
new = "cohort.is_some() || slot.handing_off(now); // NON-VACUITY BREAK: every newcomer joins the cohort"
test_file = "crates/synapse-module/src/worker_host/admission_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::joined_admission_hands_off_before_a_starved_head_and_excludes_newcomers"]
expect_message = "post-completion traffic must not extend the handoff"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-admission-handoff-expiry"
guards = "A suspended joiner cannot pin a ready shape past the 250 ms bound"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = "slot.handoff_until = Some(now + ADMISSION_HANDOFF);"
new = "slot.handoff_until = Some(now + ADMISSION_HANDOFF + std::time::Duration::from_secs(10)); // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/admission_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::suspended_joiner_handoff_expires_without_an_external_wakeup"]
expect_message = "250 ms handoff did not expire autonomously"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
