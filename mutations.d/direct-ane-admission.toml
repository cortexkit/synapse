file = "crates/synapse-module/src/worker_host/mod.rs"
old = """                        && !slot.handing_off(now)
                        && !self.recovering.contains(slot.worker.worker_id())"""
new = """                        // NON-VACUITY BREAK: resource recovery ignores pending handoff.
                        && !self.recovering.contains(slot.worker.worker_id())"""
test_file = "crates/synapse-module/src/worker_host/admission_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::joined_admission_hands_off_before_a_starved_head_and_excludes_newcomers"]
expect_message = "resource-refusal recovery must also protect the pending handoff"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
