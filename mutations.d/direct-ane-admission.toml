[[control]]
id = "ane-admission-handoff-victim"
guards = "The budget head cannot evict a ready shape before its joined cohort leases it"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = """                    && !slot.handing_off(now)
                    && !state.recovering.contains(slot.worker.worker_id())
                    && (!model_full || candidate.model_ref == head.model_ref)"""
new = """                    // NON-VACUITY BREAK: discard the handoff before joiners lease.
                    && !state.recovering.contains(slot.worker.worker_id())
                    && (!model_full || candidate.model_ref == head.model_ref)"""
test_file = "crates/synapse-module/src/worker_host/admission_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::joined_admission_hands_off_before_a_starved_head_and_excludes_newcomers"]
expect_message = "newly ready shape was selected before its eight joiners leased it"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-admission-resource-handoff"
