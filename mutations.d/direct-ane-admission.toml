[[control]]
id = "ane-admission-busy-fallback"
guards = "A busy-stream victim remains selectable when no idle candidate exists"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = """                    && slot.leases == 0
                    && !slot.handing_off(now)"""
new = """                    && slot.leases == 0
                    && slot.worker.stream_idle() // NON-VACUITY BREAK: exclude every busy stream
                    && !slot.handing_off(now)"""
test_file = "crates/synapse-module/src/worker_host/admission_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::eviction_uses_a_busy_stream_when_it_is_the_only_option"]
expect_message = "the only busy-stream victim was never selected"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

