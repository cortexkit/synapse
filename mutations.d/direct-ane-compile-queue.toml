[[control]]
id = "ane-compile-queue-orphan-expiry"
guards = "A queued compile nobody came back for is dropped after twice the retry delay it promised"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "const ORPHAN_EXPIRY_FACTOR: u32 = 2;"
new = "const ORPHAN_EXPIRY_FACTOR: u32 = 100; // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::orphaned_entry_expires_after_twice_its_promise"]
expect_message = "an entry nobody came back for kept compiling"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

