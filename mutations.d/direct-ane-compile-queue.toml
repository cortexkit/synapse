[[control]]
id = "ane-compile-queue-exit-survives-restart-panic"
guards = "A restart that panics after the old process's exit was confirmed still delivers that confirmation"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = """
            let restart = AbortOnDrop(tokio::spawn(async move {
                worker.restart_with_exit_signal(exited).await
            }));
            let (result, exited) = tokio::join!(restart.join(), forward);"""
new = """
            // NON-VACUITY BREAK: the restart's panic drops the forwarder.
            let (result, exited) = tokio::join!(async { Ok::<_, tokio::task::JoinError>(worker.restart_with_exit_signal(exited).await) }, forward);"""
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::replacement_panic_does_not_lose_a_confirmed_exit"]
expect_message = "WorkerClosed"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

