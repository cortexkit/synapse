file = "crates/synapse-module/src/worker_host/mod.rs"
old = "start_key = entry.start_key;"
new = "let _ = entry.start_key; // NON-VACUITY BREAK: accepted bounds ignored"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::cheaper_newcomer_does_not_break_an_accepted_deadline"]
expect_message = "a request told its compile would be ready in time missed its deadline"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-gather"
guards = "Compiles requested together start cheapest first, not in the order their requests arrived"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "const COMPILE_GATHER: std::time::Duration = std::time::Duration::from_millis(50);"
new = "const COMPILE_GATHER: std::time::Duration = std::time::Duration::ZERO; // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::small_compile_beside_wide_finishes_in_its_standalone_time"]
expect_message = "alone it takes"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-panic-observed"
guards = "The scheduler observes a panicked compile itself: the slot holds the gate as failed and the worker is restarted, whoever asked for the compile"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = """                        Err(error) => (
                            Err(AneResidencyError::Panicked(format!(
                                "shape admission task failed: {error}"
                            ))),
                            None,
                            now,
                        ),"""
new = """                        Err(_) => return, // NON-VACUITY BREAK: a panicked compile is ignored"""
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::panicking_orphan_admission_releases_the_gate_after_confirmed_restart", "worker_host::ane_residency::tests::panic_after_the_direct_caller_is_cancelled_is_still_cleaned_up"]
expect_message = "the panicked admission's worker was not restarted promptly"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-promise-retention"
guards = "A promise given while a compile is reserved stays with that compile, so cancelling the request that reserved it does not withdraw it"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = "            slot.promise = Some(told);"
new = "            let _ = (slot, told); // NON-VACUITY BREAK: the running compile forgets its promise"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::promise_given_during_a_reserved_compile_survives_the_owner_cancelling"]
expect_message = "condition never held"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-backstop-is-shape-compiling"
guards = "A wait on the compile queue that reaches the 600 s backstop is answered shape_compiling and keeps its compile"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = "if waiter.waiting_on_compile && Self::compiling(state, &key) {"
new = "if waiter.waiting_on_compile && Self::compiling(state, &key) && waiter.deadline.is_some() { // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::accepted_wait_past_the_600s_bound_is_shape_compiling_and_keeps_its_compile"]
expect_message = "ane_resources_exhausted"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-release-gate-on-exit-confirmation"
guards = "A failed compile's hold on the gate ends when the old process's exit is confirmed, before the replacement starts"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = "                } => self.exit_confirmed(&mut state, &worker_id, generation),"
new = "                } => { let _ = (&worker_id, generation); } // NON-VACUITY BREAK: exit confirmation ignored"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::failed_compile_releases_the_gate_before_the_replacement_starts"]
expect_message = "the gate was held while the replacement started"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-no-ghost-slots"
guards = "After a confirmed exit every slot of the old process is removed, whatever its state, even when the replacement fails"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = "        .retain(|_, slot| slot.worker.worker_id() != exited);"
new = "        .retain(|_, slot| slot.worker.worker_id() != exited || matches!(slot.state, SlotState::Resident | SlotState::Evicting)); // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::confirmed_exit_with_failed_replacement_leaves_no_ghost_slots"]
expect_message = "ghost slots after a confirmed exit"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
