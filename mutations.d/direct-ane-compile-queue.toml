[[control]]
id = "ane-compile-queue-orphan-expiry"
guards = "A queued compile nobody came back for is dropped after twice the retry delay it promised"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "const ORPHAN_EXPIRY_FACTOR: u32 = 2;"
new = "const ORPHAN_EXPIRY_FACTOR: u32 = 100; // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::orphaned_entry_expires_after_twice_its_promise"]
expect_message = "an entry nobody came back for kept compiling"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-aging"
guards = "A wide compile is passed only by compiles whose start key (arrival plus cost) is earlier"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = ".min_by_key(|(_, entry)| entry.order())"
new = ".min_by_key(|(key, entry)| (state.estimate(key, entry.seed), entry.seq)) /* NON-VACUITY BREAK: no aging */"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::wide_compile_starts_after_its_aging_window"]
expect_message = "that had aged past it"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-machine-factor"
