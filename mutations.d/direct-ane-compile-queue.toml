[[control]]
id = "ane-compile-queue-orphan-expiry"
guards = "A queued compile nobody came back for is dropped after twice the retry delay it promised"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "const ORPHAN_EXPIRY_FACTOR: u32 = 2;"
new = "const ORPHAN_EXPIRY_FACTOR: u32 = 100; // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::orphaned_entry_expires_after_twice_its_promise"]
expect_message = "an entry nobody came back for kept compiling"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-aging"
guards = "A wide compile is passed only by compiles whose start key (arrival plus cost) is earlier"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "(entry.is_none(), entry.map(QueuedCompile::order), *position)"
new = "(entry.is_none(), entry.map(|entry| (entry.cost, entry.seq)), *position) /* NON-VACUITY BREAK: no aging */"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::wide_compile_starts_after_its_aging_window"]
expect_message = "that had aged past it"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-machine-factor"
guards = "Predictions for unmeasured shapes are scaled by how much slower this machine compiled so far"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "seed.mul_f64(self.machine_factor.unwrap_or(1.0))"
new = "seed /* NON-VACUITY BREAK: machine factor ignored */"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::machine_factor_corrects_unseen_shape_predictions"]
expect_message = "refused after"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-accepted-bound"
guards = "A cheaper newcomer is not started ahead of a request that was told its compile would be ready in time"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "start_key = entry.start_key;"
new = "let _ = entry.start_key; // NON-VACUITY BREAK: accepted bounds ignored"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::cheaper_newcomer_does_not_break_an_accepted_deadline"]
expect_message = "a request told its compile would be ready in time missed its deadline"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-gather"
guards = "Compiles requested together start cheapest first, not in the order their requests arrived"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "const COMPILE_GATHER: std::time::Duration = std::time::Duration::from_millis(50);"
new = "const COMPILE_GATHER: std::time::Duration = std::time::Duration::ZERO; // NON-VACUITY BREAK"
test_file = "crates/synapse-module/src/worker_host/compile_queue_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::small_compile_beside_wide_finishes_in_its_standalone_time"]
expect_message = "alone it takes"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-panic-holds-gate-until-restart"
guards = "A panicked admission is marked failed and its worker restarted at once; the gate is released only by that confirmed restart"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "mark_failed_admission(&self.inner, &failed_key, slot_id);"
new = "// NON-VACUITY BREAK: panic leaves the slot Admitting"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::panicking_orphan_admission_releases_the_gate_after_confirmed_restart"]
expect_message = "the panicked admission's worker was not restarted promptly"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-single-orphan-driver"
guards = "Only one orphan driver exists per queued compile, so orphan expiry holds after two refusals before a yield"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = """        if entry.driver_ticket.is_some() {
            return None;
        }"""
new = "        // NON-VACUITY BREAK: a second driver may be started"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::two_refusals_before_a_yield_still_expire_the_orphan"]
expect_message = "the orphan entry outlived twice its promise"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-requeue-cancelled-admission"
guards = "An admission cancelled before reaching the worker is queued again when its caller was told shape_compiling"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = ".filter(|_| told || joined_waiting)"
new = ".filter(|_| false && (told || joined_waiting)) /* NON-VACUITY BREAK */"
test_file = "crates/synapse-module/src/worker_host/mod.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::deadline_on_an_own_admit_queued_behind_inference_is_shape_compiling"]
expect_message = "condition never held"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-backstop-is-shape-compiling"
guards = "A wait on the compile queue that reaches the 600 s backstop is answered shape_compiling and keeps its compile"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "if request_expired || compiling.is_some() {"
new = "if request_expired /* NON-VACUITY BREAK */ {"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::accepted_wait_past_the_600s_bound_is_shape_compiling_and_keeps_its_compile"]
expect_message = "ane_resources_exhausted"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800

[[control]]
id = "ane-compile-queue-release-gate-after-confirmed-exit"
guards = "A failed compile releases the compile gate and its budget once its old process's exit is confirmed, even if the restart fails"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "slot.worker.worker_id() != id || slot.state != SlotState::Failed"
new = "true /* NON-VACUITY BREAK: hold the gate after confirmed exit */"
test_file = "crates/synapse-module/src/worker_host/compile_queue_fault_tests.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::failed_compile_releases_the_gate_once_exit_is_confirmed_even_if_restart_fails"]
expect_message = "a failed compile with a confirmed exit still held the compile gate"
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
