[[control]]
id = "fingerprint-production-pin"
guards = "Production Metal vector-space fingerprints stay at their independently captured values"
file = "crates/synapse-core/src/fingerprint.rs"
old = """
#[serde(default, skip_serializing_if = "Option::is_none")]
    pub kernel_revision: Option<String>,"""
new = """
#[serde(default)] // NON-VACUITY BREAK
    pub kernel_revision: Option<String>,"""
edits = []
test_file = "crates/synapse-core/src/fingerprint.rs"
runner = "cargo"
select = "expected"
package = "synapse-core"
target = "--lib"
expect_red = ["fingerprint::tests::legacy_production_metal_fingerprints_remain_pinned"]
expect_message = "assertion `left == right` failed"
only = false
timeout_s = 600
build_timeout_s = 1800
