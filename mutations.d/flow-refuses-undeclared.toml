[[control]]
id = "flow-refuses-undeclared"
guards = "An undeclared method cannot inherit owner authority on a flow route"
file = "crates/synapse-module/src/lib.rs"
old = """
if declared_query {
            return None;
        }"""
new = """
if declared_query || !management_operations().iter().any(|op| op.name == method) { // NON-VACUITY BREAK
            return None;
        }"""
edits = []
test_file = "crates/synapse-module/src/lib.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["tests::flow_routes_get_queries_only_and_other_routes_are_unchanged"]
expect_message = "decode"
only = false
timeout_s = 600
build_timeout_s = 1800
