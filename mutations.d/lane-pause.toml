[[control]]
id = "lane-pause-no-load"
guards = "A paused refusal must not schedule a background model load"
file = "crates/synapse-module/src/lib.rs"
old = """
async fn embed_query(state: Arc<ModuleState>, params: Value) -> HandlerOutcome {
    let _pause_guard = match lane_pause::admit_params(&state, &params, ModelTask::Embed) {
        Ok(guard) => guard,
        Err(error) => return result_outcome(error_payload(&state, error)),
    };"""
new = """
async fn embed_query(state: Arc<ModuleState>, params: Value) -> HandlerOutcome {
    let _pause_guard = match lane_pause::admit_params(&state, &params, ModelTask::Embed) {
        Ok(guard) => guard,
        Err(error) => {
            // NON-VACUITY BREAK: schedule loading despite returning the pause.
            if let Some(lane) = params["model"].as_str() {
                begin_background_catalog_load(state.clone(), lane.into());
            }
            return result_outcome(error_payload(&state, error));
        }
    };"""
edits = []
test_file = "crates/synapse-module/src/lane_pause_tests.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["tests::lane_pause_tests::paused_lane_refuses_before_load_or_self_check_with_the_served_fingerprint"]
expect_message = "assertion"
only = false
timeout_s = 60
build_timeout_s = 1800

[[control]]
id = "lane-pause-no-self-check"
guards = "A paused refusal must not start a numerical self-check"
file = "crates/synapse-module/src/lib.rs"
old = """
async fn embed_query(state: Arc<ModuleState>, params: Value) -> HandlerOutcome {
    let _pause_guard = match lane_pause::admit_params(&state, &params, ModelTask::Embed) {
        Ok(guard) => guard,
        Err(error) => return result_outcome(error_payload(&state, error)),
    };"""
new = """
async fn embed_query(state: Arc<ModuleState>, params: Value) -> HandlerOutcome {
    let _pause_guard = match lane_pause::admit_params(&state, &params, ModelTask::Embed) {
        Ok(guard) => guard,
        Err(error) => {
            // NON-VACUITY BREAK: start a self-check despite returning the pause.
            if let Some(lane) = params["model"].as_str() {
                drop(join_lane_check(&state, lane));
            }
            return result_outcome(error_payload(&state, error));
        }
    };"""
