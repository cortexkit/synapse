[[control]]
id = "lane-pause-refusal"
guards = "Paused lanes answer lane_paused before any loading or admission"
file = "crates/synapse-module/src/lane_pause.rs"
old = "return Err(refusal(runtime, lane, pause));"
new = "let _ = pause; return Ok(None); // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-module/src/lane_pause_tests.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["tests::lane_pause_tests::paused_lane_refuses_before_load_or_self_check_with_the_served_fingerprint"]
expect_message = "lane_paused"
only = false
timeout_s = 60
build_timeout_s = 1800

