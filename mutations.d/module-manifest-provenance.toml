[[control]]
id = "module-manifest-provenance"
guards = "The module manifest probe exits with the SDK provenance document before starting the daemon-facing module runtime"
file = "crates/synapse-module/src/main.rs"
old = "if arguments.iter().any(|argument| argument == \"--manifest\") {"
new = "if arguments.iter().any(|argument| argument == \"--manifest-disabled\") {"
edits = []
test_file = "crates/synapse-module/tests/manifest.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--test manifest"
expect_red = ["manifest_cli_reports_provenance_from_the_compiled_tree"]
expect_message = "--manifest must exit before module startup"
only = false
timeout_s = 600
build_timeout_s = 1800
