[[control]]
id = "module-runtime-excludes-daemon"
guards = "The shipped module's normal Cargo graph refuses daemon and presence packages"
file = "crates/synapse-module/Cargo.toml"
old = 'synapse-certify = { path = "../synapse-certify" }'
new = '''synapse-certify = { path = "../synapse-certify" }
subc-daemon = { workspace = true } # NON-VACUITY BREAK'''
edits = []
test_file = "scripts/test_module_runtime_deps.py"
runner = "command"
command = ["python3", "-m", "unittest", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["scripts.test_module_runtime_deps.ModuleRuntimeDependencyTests.test_module_normal_tree_excludes_daemon_and_presence"]
expect_message = "shipped module depends on forbidden packages"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
