[[control]]
id = "nightly-breadth-selection-fence"
guards = "Nightly rendering cannot retain expected-only selection while claiming a whole-package breadth audit"
file = "scripts/prepare-mutation-audit.py"
old = 'rendered = "".join(lines)'
new = "rendered = source # NON-VACUITY BREAK"
edits = []
test_file = "scripts/test_mutation_ci.py"
runner = "command"
command = ["python", "-m", "unittest", "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["scripts.test_mutation_ci.MutationAuditTests.test_expected_selection_is_removed_without_changing_anchors"]
expect_message = "breadth rendering must remove only expected-test selection"
only = false
timeout_s = 600
build_timeout_s = 1800
