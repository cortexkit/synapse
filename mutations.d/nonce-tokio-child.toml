[[control]]
id = "nonce-tokio-child"
guards = "Asynchronous children cannot inherit the daemon credential"
file = "crates/synapse-core/src/child_process.rs"
old = "remove_launch_nonce(command.as_std_mut());"
new = "// NON-VACUITY BREAK: credential stripping omitted"
edits = []
test_file = "crates/synapse-core/tests/child_process.rs"
runner = "cargo"
select = "expected"
package = "synapse-core"
target = "--test child_process"
expect_red = ["stripped_tokio_child_environment_contains_neither_launch_nonce_variable"]
expect_message = "child inherited"
only = false
timeout_s = 600
build_timeout_s = 1800
