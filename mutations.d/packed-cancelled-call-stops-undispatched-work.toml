[[control]]
id = "packed-cancelled-call-stops-undispatched-work"
guards = "Caller abandonment drains only already-dispatched packed I/O, retaining its execution permit and lease without admitting or dispatching later standalone rungs"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = "self.0.abandoned.store(true, Ordering::Release);"
new = """
// NON-VACUITY BREAK: do not publish caller abandonment after dispatch.
            self.0.abandoned.store(false, Ordering::Release);"""
edits = []
test_file = "crates/synapse-module/src/worker_host/mod.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::packed_cancelled_mixed_call_drains_with_one_lease_at_a_time"]
expect_message = "an abandoned mixed call must not admit or dispatch its undispatched standalone rungs"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
