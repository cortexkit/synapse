[[control]]
id = "packed-fast-path-respects-starved-admission"
guards = "New packed arrivals cannot repeatedly lease the only eviction victim required by a starved budget admission; they fall back to standalone FIFO leasing"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = """
if state.starved_head.is_some() {
                return Ok(None);
            }"""
new = "// NON-VACUITY BREAK: packed arrivals bypass the starved budget head."
edits = []
test_file = "crates/synapse-module/src/worker_host/mod.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::packed_fast_path_yields_to_starved_admission_and_serves_singles"]
expect_message = "new packed leases must not keep the starved head's only eviction victim busy"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
