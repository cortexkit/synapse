[[control]]
id = "release-benchmark-cells"
guards = "Benchmark combinations must match catalog declarations with no missing or extra cells"
file = "crates/synapse-release-checks/check.py"
old = "require({(c['row_id'], c['model']) for c in cells} == set(expected_cells), 'benchmark differs from catalog cells')"
new = "require(True, 'benchmark differs from catalog cells')  # NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-release-checks/test_checks.py"
runner = "command"
command = ["python3", "-c", 'import subprocess,sys,unittest; print("MUTATION DIFF STAT:", flush=True); print(subprocess.check_output(["git","diff","--stat"]).decode(), flush=True); sys.path.insert(0,"crates/synapse-release-checks"); unittest.main(module=None, argv=["unittest",sys.argv[1]], verbosity=2)', "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["test_checks.ReleaseChecks.test_benchmark_support_and_completeness"]
expect_message = "not raised"
only = false
timeout_s = 120
build_timeout_s = 1800
