[[control]]
id = "release-catalog-cells"
guards = "Only declared catalog backends generate required hardware cells"
file = "crates/synapse-release-checks/check.py"
old = "if any(lane['backend'] == backend for lane in model['backends'])]"
new = "if True]  # NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-release-checks/test_checks.py"
runner = "command"
command = ["python3", "-c", 'import subprocess,sys,unittest; print("MUTATION DIFF STAT:", flush=True); print(subprocess.check_output(["git","diff","--stat"]).decode(), flush=True); sys.path.insert(0,"crates/synapse-release-checks"); unittest.main(module=None, argv=["unittest",sys.argv[1]], verbosity=2)', "{test}"]
test_count_pattern = "Ran {count} test"
expect_red = ["test_checks.ReleaseChecks.test_catalog_cells_follow_declared_backends"]
expect_message = "qwen3-reranker-0.6b"
only = false
timeout_s = 120
build_timeout_s = 1800
