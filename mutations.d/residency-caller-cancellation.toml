[[control]]
id = "residency-caller-cancellation"
guards = "Caller cancellation cannot cancel worker I/O, misread a stale reply, or restart a healthy worker"
file = "crates/synapse-module/src/worker_host/mod.rs"
old = """
            let joined = match deadline {
                Some(deadline) => match tokio::time::timeout_at(deadline, task).await {
                    Ok(joined) => joined,
                    Err(_) => {
                        #[cfg(test)]
                        self.channel.pass_classify_gate(GateSite::Caller).await;
                        return Err(self.channel.expired_wait(&waits, deadline));
                    }
                },
                None => task.await,
            };"""
new = """
            // NON-VACUITY BREAK: give a detached inference the caller's lifetime.
            struct CancelOnDrop<T>(tokio::task::JoinHandle<T>);
            impl<T> Drop for CancelOnDrop<T> {
                fn drop(&mut self) { self.0.abort(); }
            }
            let mut task = CancelOnDrop(task);
            let joined = match deadline {
                Some(deadline) => match tokio::time::timeout_at(deadline, &mut task.0).await {
                    Ok(joined) => joined,
                    Err(_) => {
                        #[cfg(test)]
                        self.channel.pass_classify_gate(GateSite::Caller).await;
                        return Err(self.channel.expired_wait(&waits, deadline));
                    }
                },
                None => (&mut task.0).await,
            };"""
edits = []
test_file = "crates/synapse-module/src/worker_host/mod.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::serving_caller_cancellation_drains_reply_without_restart"]
expect_message = "caller cancellation must drain the reply without restarting"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
