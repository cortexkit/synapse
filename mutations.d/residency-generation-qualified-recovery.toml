[[control]]
id = "residency-generation-qualified-recovery"
guards = "A stale serving fault keeps its reported generation at scheduler ingress and does not restart an already-restored worker"
file = "crates/synapse-module/src/worker_host/ane_residency/scheduler.rs"
old = """                } => self.start_recovery(
                    &mut state,
                    &worker,
                    generation,
                    Some(reply),"""
new = """                } => self.start_recovery(
                    &mut state,
                    &worker,
                    worker.generation(), // NON-VACUITY BREAK: recover the replacement for an old fault
                    Some(reply),"""
edits = []
test_file = "crates/synapse-module/src/worker_host/mod.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
select = "expected"
expect_red = ["worker_host::ane_residency::tests::stale_serving_fault_after_recovery_does_not_restart_restored_owner"]
expect_message = "assertion `left == right` failed"
only = false
platforms = ["linux", "macos"]
timeout_s = 600
build_timeout_s = 1800
