[[control]]
id = "restore-approvals-disabled"
guards = "Restore import cannot resurrect enabled approvals from a pre-revocation capture"
file = "crates/synapse-module/src/store.rs"
old = "for mut row in approval_rows {"
new = "for mut row in approval_rows.into_iter().take(0) { // NON-VACUITY BREAK: imported approvals retain captured authority"
edits = []
test_file = "crates/synapse-module/src/store.rs"
runner = "nextest"
select = "expected"
package = "synapse-module"
target = "--lib"
expect_red = ["store::tests::restore_import_forces_imported_approvals_disabled_preventing_resurrection"]
expect_message = "approvals table row must be forced disabled on restore"
only = false
timeout_s = 600
build_timeout_s = 1800
