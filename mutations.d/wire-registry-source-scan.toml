[[control]]
id = "wire-registry-source-scan"
guards = "Every production management operation must appear in the consumer wire inventory"
file = "crates/synapse-module/src/lib.rs"
old = 'op("models.catalog", Query),'
new = """
op("models.catalog", Query),
        op("models.undocumented", Query), // NON-VACUITY BREAK"""
edits = []
test_file = "crates/synapse-module/tests/wire_contract.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib --test wire_contract"
# Both the runtime registry and source-parsed consumer inventory reject an
# undocumented management operation; both targets are selected above.
expect_red = [
    "management_registry_matches_wire_contract",
    "tests::wire_contract_documents_every_management_operation",
]
expect_message = '/assertion `left == right` failed|wire contract is missing registered operations: \["models\.undocumented"\]/'
only = false
timeout_s = 600
build_timeout_s = 1800
