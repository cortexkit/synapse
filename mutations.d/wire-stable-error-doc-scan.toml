[[control]]
id = "wire-stable-error-doc-scan"
guards = "Every stable refusal code must be documented so consumers can recover by its wire name"
file = "docs/wire-contract-v1.md"
old = "`owned_cuda_unsupported`"
new = "`owned_cuda_undocumented` <!-- NON-VACUITY BREAK -->"
edits = []
test_file = "crates/synapse-module/src/lib.rs"
runner = "nextest"
package = "synapse-module"
target = "--lib"
hub = "Stable wire error names must be documented, asserted by the module enum inventory and the exhaustive consumer wire-name contract."
hub_targets = ["synapse-module::wire_contract"]
expect_red = ["tests::wire_contract_documents_every_stable_error_code"]
expect_message = "wire contract is missing stable error codes"
only = false
timeout_s = 600
build_timeout_s = 1800
