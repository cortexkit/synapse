[[control]]
id = "worker-manifest-provenance"
guards = "The ANE-direct worker manifest probe reports build provenance on every platform, without needing its socket or launch nonce"
file = "crates/synapse-worker-ane-direct/src/main.rs"
old = "        .provenance(Some(provenance))"
new = "        .provenance(None) // NON-VACUITY BREAK: drop worker provenance"
edits = []
test_file = "crates/synapse-worker-ane-direct/tests/manifest.rs"
runner = "nextest"
select = "expected"
package = "synapse-worker-ane-direct"
target = "--test manifest"
expect_red = ["manifest_cli_reports_provenance_from_the_compiled_tree"]
expect_message = "SDK worker manifest includes provenance"
only = false
timeout_s = 600
build_timeout_s = 1800
