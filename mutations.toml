
# Deliberate breaks of silent safety and compatibility guards. Create rows with
# the pinned runner's prove command; compilation errors and timeouts are not catches.
# Integration tests launch this production entry point. Refresh its test-support
# fixture after each mutant so an unchanged executable cannot hide a source break.
prebuild = [
    { name = "module-fixture", command = ["cargo", "build", "--locked", "-p", "synapse-module", "--bin", "ck-synapse", "--features", "test-support"], timeout_s = 1800 },
]

[[control]]
id = "nonce-sync-child"
guards = "Children cannot inherit the daemon credential through the synchronous production helper"
file = "crates/synapse-core/src/child_process.rs"
old = "remove_launch_nonce(&mut command);"
new = "// NON-VACUITY BREAK: credential stripping omitted"
edits = []
test_file = "crates/synapse-core/tests/child_process.rs"
runner = "cargo"
select = "expected"
package = "synapse-core"
target = "--test child_process"
expect_red = ["stripped_child_environment_contains_neither_launch_nonce_variable"]
expect_message = "child inherited"
only = false
timeout_s = 600
build_timeout_s = 1800


