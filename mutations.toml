[[control]]
id = "fingerprint-none-fields"
guards = "Absent optional profile fields do not rotate the hashed bytes of existing vector spaces"
file = "crates/synapse-core/src/fingerprint.rs"
old = """
#[serde(default, skip_serializing_if = "Option::is_none")]
    pub operation: Option<String>,"""
new = """
#[serde(default)] // NON-VACUITY BREAK
    pub operation: Option<String>,"""
edits = []
test_file = "crates/synapse-core/src/fingerprint.rs"
runner = "cargo"
package = "synapse-core"
target = "--lib"
expect_red = ["fingerprint::tests::legacy_coreml_bytes_and_hash_derivation_are_unchanged"]
expect_message = "assertion `left == right` failed"
only = false
timeout_s = 600
build_timeout_s = 1800


