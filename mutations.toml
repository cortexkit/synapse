[[control]]
id = "profile-probe-fail-closed"
guards = "A failed machine identity probe cannot become a placeholder profile carrying certification authority"
file = "crates/synapse-core/src/machine_profile.rs"
old = "let base = collector.collect_base_profile()?;"
new = 'let base = collector.collect_base_profile().unwrap_or(MachineProfileBase { os_build: "unknown".into(), arch: "unknown".into(), chip_model: "unknown".into(), ram_class: "unknown".into(), ane_subtype: None }); // NON-VACUITY BREAK'
edits = []
test_file = "crates/synapse-core/src/machine_profile.rs"
runner = "cargo"
package = "synapse-core"
target = "--lib"
expect_red = ["machine_profile::tests::a_probe_refusal_propagates_instead_of_yielding_a_profile"]
expect_message = "a refused probe must not produce a profile"
only = false
timeout_s = 600
build_timeout_s = 1800


[[control]]
id = "admission-submitted-text-hash"
guards = "Truncation must not change the digest echo of the caller-submitted text"
file = "crates/synapse-core/src/tokenizer.rs"
old = "let submitted_sha256 = sha256_text(text);"
new = "let submitted_sha256 = sha256_text(&embedded_text); // NON-VACUITY BREAK"
edits = []
test_file = "crates/synapse-core/src/tokenizer.rs"
runner = "cargo"
package = "synapse-core"
target = "--lib"
expect_red = ["tokenizer::tests::tokenizer_strips_padding_and_reports_our_truncation"]
expect_message = "truncated items must hash the original submitted text before truncation"
only = false
timeout_s = 600
build_timeout_s = 1800

