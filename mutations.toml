file = "crates/synapse-module/src/worker_host/mod.rs"
old = """
            let joined = match deadline {
                Some(deadline) => tokio::time::timeout_at(deadline, task)
                    .await
                    .map_err(|_| AneResidencyError::DeadlineExceeded)?,
                None => task.await,
            };"""
new = """
            // NON-VACUITY BREAK: give a detached inference the caller's lifetime.
            struct CancelOnDrop<T>(tokio::task::JoinHandle<T>);
            impl<T> Drop for CancelOnDrop<T> {
                fn drop(&mut self) { self.0.abort(); }
            }
            let mut task = CancelOnDrop(task);
            let joined = match deadline {
                Some(deadline) => tokio::time::timeout_at(deadline, &mut task.0)
                    .await
                    .map_err(|_| AneResidencyError::DeadlineExceeded)?,
                None => (&mut task.0).await,
            };"""
