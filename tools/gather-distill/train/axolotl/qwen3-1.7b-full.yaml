base_model: Qwen/Qwen3-1.7B
tokenizer_type: AutoTokenizer
trust_remote_code: false

# Full rendering is byte-identical to the tokenizer template; the patch only stabilizes Axolotl's prefix-based mask boundaries.
chat_template: jinja
chat_template_jinja: train/axolotl/templates/qwen3-aft.jinja
datasets:
  - path: train/sft-dataset.jsonl
    type: chat_template
    field_messages: messages
    field_tools: tools
    roles_to_train:
      - assistant
    train_on_eos: turn

dataset_prepared_path: train/prepared/qwen3-1.7b-full
output_dir: train/outputs/qwen3-1.7b-full
val_set_size: 0.02

sequence_len: 32768
sample_packing: true
eval_sample_packing: false

micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 2
learning_rate: 0.00002
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.1
optimizer: adamw_torch_fused

bf16: true
tf32: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

logging_steps: 1
evals_per_epoch: 1
saves_per_epoch: 1
save_safetensors: true
seed: 8918
